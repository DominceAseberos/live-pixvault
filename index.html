<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIXVAULT — Free Design Resources, GIFs & UI Components</title>
    <meta name="description" content="PIXVAULT is your free vault of trending GIFs, copy-paste UI components, and curated design inspiration — all powered by live APIs." />
    <meta property="og:title" content="PIXVAULT — Free Design Resources" />
    <meta property="og:description" content="Trending GIFs, UI components, and design inspiration — 100% free." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
    <script>
      let isSyncing = false;
      let syncTimeout;
      window.addEventListener('scroll', () => {
        if (isSyncing || window.parent === window) return;
        const sh = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPercentage = sh > 0 ? window.scrollY / sh : 0;
        window.parent.postMessage({ type: 'SYNC_STATE', payload: { scrollPercentage, url: window.location.pathname } }, '*');
      }, { passive: true });
      const originalPushState = history.pushState;
      history.pushState = function() {
        originalPushState.apply(this, arguments);
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'SYNC_STATE', payload: { url: window.location.pathname } }, '*');
        }
      };
      window.addEventListener('popstate', () => {
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'SYNC_STATE', payload: { url: window.location.pathname } }, '*');
        }
      });
      window.addEventListener('message', (e) => {
        if (!e.data || e.data.type !== 'UPDATE_STATE') return;
        if (e.data.payload.url && e.data.payload.url !== window.location.pathname) {
          history.pushState(null, '', e.data.payload.url);
          window.dispatchEvent(new PopStateEvent('popstate'));
          return;
        }
        if (e.data.payload.scrollPercentage !== undefined) {
          isSyncing = true;
          clearTimeout(syncTimeout);
          const targetY = e.data.payload.scrollPercentage * (document.documentElement.scrollHeight - window.innerHeight);
          window.scrollTo({ top: targetY, behavior: 'instant' });
          syncTimeout = setTimeout(() => { isSyncing = false; }, 100);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
